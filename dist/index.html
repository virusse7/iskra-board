<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iskra — przestrzeń na pomysły</title><style>
*{box-sizing:border-box}html,body{overscroll-behavior:none;overflow:hidden}body{margin:0;font-family:Inter,Arial,sans-serif;color:#26332e;background:#f7f8f4}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #dce1d9;background:white;border-radius:10px;padding:11px 15px;color:inherit}button:hover{background:#eef2e8}button.active{background:#e2edbf;border-color:#96ad55}header{height:80px;display:flex;align-items:center;gap:28px;padding:0 30px;background:#fff;border-bottom:1px solid #e4e7df}.logo{font-size:26px;font-weight:800;letter-spacing:-1px}.logo span{color:#759337}.divider{height:28px;width:1px;background:#e3e6df}#title{border:0;background:none;font-weight:600;width:240px;outline:none}.saved{font-size:12px;color:#7c877e;margin-left:auto}.primary{background:#293e30;color:white;border-color:#293e30}.primary:hover{background:#405c40}aside{position:absolute;top:80px;bottom:0;width:242px;border-right:1px solid #e0e5da;background:#fcfdf9;padding:30px 22px}aside h1{font-size:21px;line-height:1.3;letter-spacing:-.5px;margin:0 0 10px}aside p{color:#7c857d;font-size:13px;line-height:1.7}.label{font-size:10px;letter-spacing:1.7px;color:#8a948a;font-weight:bold;margin:34px 0 12px}.tool{width:100%;text-align:left;margin-bottom:8px;border-color:transparent;background:transparent}.tool.active{background:#eaf0df}.swatches{display:flex;gap:9px}.swatch{width:28px;height:28px;border-radius:50%;padding:0;border:3px solid white;box-shadow:0 0 0 1px #dfe3db}.swatch.active{box-shadow:0 0 0 2px #526749}.hint{position:absolute;bottom:24px;left:22px;right:22px;padding:14px;background:#f0f3e9;border-radius:12px;font-size:12px;line-height:1.6;color:#7a8573}main{position:absolute;left:242px;right:0;top:80px;bottom:0;overflow:auto;overscroll-behavior:none;background-image:radial-gradient(#cfd7c9 1px,transparent 1px);background-size:22px 22px}#board{position:relative;width:4800px;height:3600px;touch-action:none;cursor:grab;user-select:none}svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}path{fill:none;stroke:#8d9e85;stroke-width:2.5;pointer-events:stroke;cursor:pointer}path:hover{stroke:#d76d58;stroke-width:5}.card{position:absolute;width:230px;min-height:164px;padding:18px;border-radius:4px 4px 20px 4px;box-shadow:0 7px 14px #35452b0b;border:1px solid #00000008;cursor:grab;transition:box-shadow .15s}.card.selected{outline:2px solid #69834b;outline-offset:4px;box-shadow:0 12px 25px #35452b20}.card .top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#626c5c;align-items:center;margin-bottom:15px}.card .top button{border:0;padding:0 4px;background:transparent;font-size:17px;opacity:.5}.card textarea{display:block;width:100%;height:84px;resize:none;border:0;outline:0;background:none;line-height:1.5;font-size:17px;font-weight:500;color:#303b2d;cursor:text}.card small{color:#6f795f;font-size:10px}.floating{position:fixed;bottom:24px;left:calc(50% + 121px);transform:translateX(-50%);display:flex;align-items:center;gap:15px;background:#fff;border:1px solid #e0e5da;border-radius:12px;padding:9px 16px;box-shadow:0 5px 20px #293e3008;font-size:12px;color:#788273}#toast{position:fixed;top:100px;left:55%;background:#293e30;color:white;padding:12px 20px;border-radius:12px;display:none;z-index:20}#import{display:none}@media(max-width:760px){header{padding:0 14px;gap:12px}.divider,.saved,header .export{display:none}#title{width:130px}aside{width:170px;padding:25px 14px}main{left:170px}.floating{left:calc(50% + 85px);white-space:nowrap}.hint{left:14px;right:14px}.card{width:210px}}

.card-title{border:0;border-radius:4px;background:transparent;width:100%;min-width:0;padding:4px 2px;font-size:12px;font-weight:700;color:inherit;letter-spacing:.3px;cursor:text}.card-title:focus{outline:2px solid #69834b;outline-offset:2px}.card-title::placeholder{color:inherit;opacity:.65}.card .top{gap:8px}
html[data-theme="dark"]{color-scheme:dark}html[data-theme="dark"] body{background:#171d1a;color:#e0e8df}html[data-theme="dark"] header,html[data-theme="dark"] .floating{background:#202923;border-color:#364238}html[data-theme="dark"] aside{background:#1c241f;border-color:#364238}html[data-theme="dark"] main{background-color:#171d1a;background-image:radial-gradient(#354238 1px,transparent 1px)}html[data-theme="dark"] button{background:#28342c;border-color:#435044;color:#e0e8df}html[data-theme="dark"] button:hover{background:#354539}html[data-theme="dark"] .tool{background:transparent;border-color:transparent}html[data-theme="dark"] button.active{background:#3b5030;border-color:#789554}html[data-theme="dark"] .primary{background:#b4cf87;color:#1b291c}html[data-theme="dark"] .primary:hover{background:#c4df97}html[data-theme="dark"] #title{color:#e0e8df}html[data-theme="dark"] .divider{background:#435044}html[data-theme="dark"] .hint{background:#29362a;color:#b0c0a8}html[data-theme="dark"] aside p,html[data-theme="dark"] .label,html[data-theme="dark"] .saved,html[data-theme="dark"] .floating{color:#a7b6a9}html[data-theme="dark"] dialog{background:#202923;color:#e0e8df!important;border-color:#435044!important}html[data-theme="dark"] dialog input{background:#172019;color:#e0e8df;border-color:#526450!important}html[data-theme="dark"] .card{color-scheme:light;color:#303b2d}html[data-theme="dark"] .card .top button{background:transparent;color:#303b2d}html[data-theme="dark"] path{stroke:#879e77}dialog::backdrop{background:#0008}.swatch{color-scheme:light}

.card{display:flex;flex-direction:column;height:194px;min-width:210px;min-height:194px}.card .top{flex-shrink:0}.card textarea{flex:1;min-height:40px;height:auto}.card small{flex-shrink:0;margin-top:12px;padding-right:12px}.resize-handle{position:absolute;right:3px;bottom:3px;width:24px;height:24px;padding:0;border:0;border-radius:0 0 14px 0;background:transparent;color:#66734d;cursor:nwse-resize;touch-action:none;font-size:20px;line-height:24px}.resize-handle:hover{background:#0001}.resize-handle:focus-visible{outline:2px solid #69834b}html[data-theme="dark"] .resize-handle{background:transparent;color:#66734d}
</style></head><body><header><div class="logo"><span>✳</span> iskra</div><div class="divider"></div><input id="title" aria-label="Nazwa tablicy" value="Moja burza mózgów"><span class="saved" id="saved">● Zapisano w przeglądarce</span><button id="themeToggle" type="button" aria-label="Włącz ciemny motyw" aria-pressed="false">☾ Motyw</button><button class="export" id="export">↓ Eksport</button><button class="primary" id="add">＋ Nowy pomysł</button></header><aside><h1>Wielkie rzeczy<br>zaczynają się od iskry.</h1><p>Złap myśl. Daj jej miejsce.<br>Połącz kropki.</p><div class="label">TWOJE NARZĘDZIA</div><button class="tool active" id="move">↖ &nbsp; Przesuwaj</button><button class="tool" id="connect">⌁ &nbsp; Połącz pomysły</button><div class="label">KOLOR NOWEJ MYŚLI</div><div class="swatches" id="colors"></div><div class="label">TABLICA</div><p id="count"></p><button class="tool" id="importBtn">↥ &nbsp; Wczytaj tablicę</button><input id="import" type="file" accept="application/json"><div class="hint">✦ &nbsp; Mała podpowiedź<br>Kliknij dwa razy w puste miejsce, aby dodać pomysł właśnie tam.</div></aside><main id="viewport"><div id="board"><svg id="lines"></svg><div id="cards"></div></div></main><div class="floating"><span id="mode">Przeciągnij puste tło, aby przesunąć tablicę</span><span>✦</span><span id="stats"></span></div><div id="toast"></div><script>
const $=id=>document.getElementById(id),palette=['#f5edb4','#e2ebd1','#e8dff2','#f6dfcd','#dcebf0'];let color=palette[0],mode='move',selected=null,source=null,drag=null,resizing=null;
const initial={title:'Moja burza mózgów',nodes:[{id:'a',x:390,y:100,text:'Od czego zaczynamy?\nMój następny wielki pomysł ✨',color:palette[0]},{id:'b',x:80,y:345,text:'Co chcę osiągnąć?\nZapisz tutaj swój cel.',color:palette[1]},{id:'c',x:690,y:330,text:'A gdyby tak…\nTu jest miejsce na odważne pomysły.',color:palette[2]},{id:'d',x:390,y:570,text:'Pierwszy mały krok\nCo mogę zrobić już dziś?',color:palette[3]}],edges:[['a','b'],['a','c'],['b','d']]};let data;try{data=JSON.parse(localStorage.getItem('iskra-board-v1'))||structuredClone(initial)}catch{data=structuredClone(initial)}
function save(){try{localStorage.setItem('iskra-board-v1',JSON.stringify(data));$('saved').textContent='● Zapisano w przeglądarce'}catch{$('saved').textContent='Nie udało się zapisać — użyj eksportu'}stats()}
function stats(){$('count').textContent=data.nodes.length+' pomysłów · '+data.edges.length+' połączeń';$('stats').textContent=data.nodes.length+' pomysłów'}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2800)}
function lines(){$('lines').replaceChildren();data.edges.forEach(([a,b],i)=>{a=data.nodes.find(n=>n.id===a);b=data.nodes.find(n=>n.id===b);if(!a||!b)return;const p=document.createElementNS('http://www.w3.org/2000/svg','path'),x=a.x+(a.width??230)/2,y=a.y+(a.height??194)/2,xx=b.x+(b.width??230)/2,yy=b.y+(b.height??194)/2;p.setAttribute('d',`M ${x} ${y} C ${x} ${(y+yy)/2}, ${xx} ${(y+yy)/2}, ${xx} ${yy}`);p.addEventListener('dblclick',e=>{e.stopPropagation();data.edges.splice(i,1);save();lines();toast('Usunięto połączenie')});p.setAttribute('aria-label','Połączenie — kliknij dwukrotnie, aby usunąć');$('lines').append(p)})}
function choose(id){selected=id;document.querySelectorAll('.card').forEach(el=>el.classList.toggle('selected',el.dataset.id===id))}
function link(id){if(!source){source=id;choose(id);toast('Teraz kliknij drugi pomysł');return}if(source!==id&&!data.edges.some(e=>e.includes(source)&&e.includes(id))){data.edges.push([source,id]);save();lines()}source=null;choose(null)}
function render(){$('title').value=data.title;$('cards').replaceChildren();data.nodes.forEach((n,i)=>{const el=document.createElement('article');el.className='card';el.dataset.id=n.id;el.style.cssText=`left:${n.x}px;top:${n.y}px;background:${n.color};width:${n.width??230}px;height:${n.height??194}px`;const top=document.createElement('div');top.className='top';const label=document.createElement('input');label.className='card-title';label.type='text';label.maxLength=120;label.value=n.title??'';label.placeholder='POMYSŁ '+String(i+1).padStart(2,'0');label.setAttribute('aria-label','Nazwa pomysłu '+(i+1));label.oninput=()=>{n.title=label.value;save()};label.onpointerdown=e=>{if(mode==='move')e.stopPropagation()};const del=document.createElement('button');del.textContent='×';del.title='Usuń pomysł';del.onclick=e=>{e.stopPropagation();data.nodes=data.nodes.filter(v=>v.id!==n.id);data.edges=data.edges.filter(v=>!v.includes(n.id));save();render()};top.append(label,del);const t=document.createElement('textarea');t.value=n.text;t.setAttribute('aria-label','Treść pomysłu '+(i+1));t.oninput=()=>{n.text=t.value;save()};t.onpointerdown=e=>{if(mode==='move')e.stopPropagation()};const foot=document.createElement('small');foot.textContent='✦ PRZESTRZEŃ NA MOŻLIWOŚCI';el.append(top,t,foot);const handle=document.createElement('button');handle.className='resize-handle';handle.type='button';handle.textContent='◢';handle.setAttribute('aria-label','Zmień rozmiar pomysłu '+(i+1));handle.title='Przeciągnij, aby zmienić rozmiar. Strzałki: 10 px, Shift: 50 px';
function resizeTo(w,h){const size=IskraCore.clampSize(w,h,n.x,n.y);n.width=size.width;n.height=size.height;el.style.width=n.width+'px';el.style.height=n.height+'px';lines()}
handle.onpointerdown=e=>{if(e.button!==0)return;e.stopPropagation();e.preventDefault();choose(n.id);resizing={id:n.id,pointer:e.pointerId,x:e.clientX,y:e.clientY,width:el.offsetWidth,height:el.offsetHeight};handle.setPointerCapture(e.pointerId)};
handle.onpointermove=e=>{if(!resizing||resizing.id!==n.id||resizing.pointer!==e.pointerId)return;e.stopPropagation();resizeTo(resizing.width+e.clientX-resizing.x,resizing.height+e.clientY-resizing.y)};
function finishResize(e){if(!resizing||resizing.id!==n.id)return;e.stopPropagation();resizing=null;save();if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId)}
handle.onpointerup=finishResize;handle.onpointercancel=finishResize;handle.onlostpointercapture=e=>{if(resizing?.id===n.id){resizing=null;save()}};
handle.onkeydown=e=>{const directions={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]};if(!directions[e.key])return;e.preventDefault();e.stopPropagation();const [dx,dy]=directions[e.key],step=e.shiftKey?50:10;resizeTo(el.offsetWidth+dx*step,el.offsetHeight+dy*step);save()};el.append(handle);el.onpointerdown=e=>{if(e.target.closest('button'))return;if(mode==='connect'){e.preventDefault();link(n.id);return}choose(n.id);drag={id:n.id,dx:e.clientX-n.x,dy:e.clientY-n.y};el.setPointerCapture(e.pointerId);e.preventDefault()};el.onpointermove=e=>{if(!drag||drag.id!==n.id)return;n.x=Math.max(0,Math.min(4800-el.offsetWidth,e.clientX-drag.dx));n.y=Math.max(0,Math.min(3600-el.offsetHeight,e.clientY-drag.dy));el.style.left=n.x+'px';el.style.top=n.y+'px';lines()};el.onpointerup=()=>{if(drag){drag=null;save()}};el.onpointercancel=()=>{drag=null;save()};$('cards').append(el)});lines();stats();choose(selected)}
function add(x,y){const v=$('viewport');const n={id:crypto.randomUUID(),x:x??v.scrollLeft+Math.max(35,(v.clientWidth-230)/2),y:y??v.scrollTop+160,text:'',color};data.nodes.push(n);save();render();choose(n.id);document.querySelector(`[data-id="${n.id}"] textarea`).focus()}
const viewport=$('viewport'),board=$('board');let pan=null;
board.addEventListener('pointerdown',e=>{if(e.button!==0||(e.target!==board&&e.target!==$('lines')))return;pan={id:e.pointerId,x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};board.setPointerCapture(e.pointerId);board.style.cursor='grabbing';e.preventDefault()});
board.addEventListener('pointermove',e=>{if(!pan||pan.id!==e.pointerId)return;viewport.scrollLeft=pan.left+pan.x-e.clientX;viewport.scrollTop=pan.top+pan.y-e.clientY});
function stopPan(e){if(!pan||pan.id!==e.pointerId)return;pan=null;board.style.cursor='grab';if(board.hasPointerCapture(e.pointerId))board.releasePointerCapture(e.pointerId)}
board.addEventListener('pointerup',stopPan);board.addEventListener('pointercancel',stopPan);board.addEventListener('lostpointercapture',()=>{pan=null;board.style.cursor='grab'});
viewport.addEventListener('wheel',e=>{if(e.ctrlKey)return;e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?viewport.clientHeight:1;viewport.scrollLeft+=(e.shiftKey&&!e.deltaX?e.deltaY:e.deltaX)*unit;viewport.scrollTop+=(e.shiftKey&&!e.deltaX?0:e.deltaY)*unit},{passive:false});
$('add').onclick=()=>add();$('board').ondblclick=e=>{if(e.target===$('board')||e.target===$('lines')){const r=$('board').getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top)}};
function setMode(m){mode=m;source=null;choose(null);$('move').classList.toggle('active',m==='move');$('connect').classList.toggle('active',m==='connect');$('mode').textContent=m==='move'?'Przeciągnij puste tło, aby przesunąć tablicę':'Kliknij dwa pomysły, aby je połączyć';document.querySelectorAll('textarea,.card-title').forEach(t=>t.readOnly=m==='connect')}
$('move').onclick=()=>setMode('move');$('connect').onclick=()=>setMode('connect');$('title').oninput=e=>{data.title=e.target.value;save()};palette.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(c===color?' active':'');b.style.background=c;b.setAttribute('aria-label','Kolor '+c);b.onclick=()=>{color=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b));if(selected){data.nodes.find(n=>n.id===selected).color=c;save();render()}};$('colors').append(b)});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='iskra-tablica.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('importBtn').onclick=()=>$('import').click();$('import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(typeof d.title!=='string'||!Array.isArray(d.nodes)||!Array.isArray(d.edges)||d.nodes.length>500||!d.nodes.every(n=>typeof n.id==='string'&&(n.width===undefined||(Number.isFinite(n.width)&&n.width>=210&&n.width<=1200))&&(n.height===undefined||(Number.isFinite(n.height)&&n.height>=194&&n.height<=1200))&&(n.title===undefined||(typeof n.title==='string'&&n.title.length<=120))&&typeof n.text==='string'&&Number.isFinite(n.x)&&Number.isFinite(n.y)&&palette.includes(n.color))||!d.edges.every(a=>Array.isArray(a)&&a.length===2&&a.every(id=>d.nodes.some(n=>n.id===id))))throw Error();data=d;selected=null;source=null;save();render();setMode(mode);toast('Wczytano tablicę')}catch{toast('Nieprawidłowy plik tablicy')}e.target.value=''};document.addEventListener('keydown',e=>{if(e.key==='Escape')setMode('move')});render();
</script><script src="theme.js"></script><script src="config.js"></script><script src="config.local.js"></script><script src="board-core.js"></script><script src="realtime.js"></script><script src="rooms.js"></script><script src="sync.js"></script></body></html>
